<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PEAK 已保存內容瀏覽</title>
<style>
:root{--ink:#193e36;--muted:#65756d;--line:#d8e2da;--paper:#f5f7f1;--green:#136b54;--amber:#8e6320}*{box-sizing:border-box}body{margin:0;background:var(--paper);font:16px/1.65 system-ui,"Microsoft JhengHei",sans-serif;color:var(--ink)}main{max-width:1260px;margin:auto;padding:32px 26px 65px}header{display:flex;justify-content:space-between;gap:20px;align-items:start}h1{font-size:33px;line-height:1.3;margin:6px 0 8px}h2{font-size:23px;margin:5px 0}h3{font-size:16px;margin:18px 0 8px}p{margin:7px 0}.eyebrow{font-size:12px;letter-spacing:.15em;color:var(--green);font-weight:700}.muted,small{color:var(--muted)}.tag{display:inline-block;padding:3px 9px;border-radius:5px;background:#e4efe5;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,input{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:8px 15px}button:hover{border-color:var(--green)}button:disabled{opacity:.4;cursor:default}.primary,.selected{background:var(--green);color:white;border-color:var(--green)}input{flex:1;min-width:220px;padding:12px 14px;border:1px solid #aabfb1;border-radius:8px;background:white}#search{margin:25px 0 15px}#categories{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 20px}#pager{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:18px 0}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.cards.single{grid-template-columns:1fr}.card{min-width:0;background:white;border:1px solid var(--line);border-radius:12px;padding:24px}.english{font-size:15px;color:var(--muted);margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;padding:0;margin:12px 0}.stat{background:#eff5ef;border-radius:7px;padding:12px}.stat dt{font-size:13px;color:var(--muted)}.stat dd{font-size:25px;font-weight:650;margin:3px 0 0}.condition{font-size:20px;padding:13px 16px;background:#edf5ee;border-left:3px solid var(--green);border-radius:5px}.source-line{font-size:13px;margin:12px 0;color:#476759}a{color:var(--green);overflow-wrap:anywhere}.missing{background:#fff8e8;border-radius:7px;padding:12px 15px;font-size:14px}.missing ul{margin:5px 0;padding-left:19px}.source{padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.source:last-child{border:0}.source p{margin:4px 0}details{margin-top:15px;border-top:1px solid var(--line);padding-top:11px}summary{cursor:pointer;font-size:14px;color:var(--green);font-weight:600}ul{padding-left:22px}li{margin:5px 0}pre{font:12px/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:360px;overflow:auto;background:#edf1eb;padding:14px;border-radius:7px}.guide{padding:5px 0 7px;border-bottom:1px solid #e7ede6}.error{background:#ffe8e0;border-radius:8px;padding:15px;color:#923523}#engineering{margin-top:35px;background:white;border:1px solid var(--line);border-radius:10px;padding:16px 20px}#engineering summary{font-weight:500}#engineering h2{font-size:20px;margin-top:20px}#diagLinks{display:flex;flex-wrap:wrap;gap:15px}.empty{padding:30px;background:white;border:1px dashed var(--line);border-radius:10px}.small-note{font-size:13px}footer{margin-top:22px;color:var(--muted);font-size:13px}@media(max-width:800px){main{padding:22px 15px}.cards{grid-template-columns:1fr}.card{padding:19px}header{display:block}h1{font-size:28px}#pager{align-items:start}}
</style></head><body><main>
<header><div><div class="eyebrow">PEAK · SAVED KNOWLEDGE</div><h1>已保存的遊戲資料</h1><p id="catalogStats" class="muted">正在讀取資料庫…</p></div><button id="refresh">重新讀取內容</button></header>
<p class="small-note muted">唯讀內容核對：依現存來源顯示具體欄位與缺漏，尚未人工發布。</p>
<form id="search" class="toolbar"><input id="query" aria-label="搜尋已保存內容" placeholder="搜尋名稱或別名，例如「飛機餐」「成就」「Ancient Idol」"><button class="primary" type="submit">搜尋</button><button type="button" id="clear">清除</button></form>
<nav id="categories" aria-label="資料分類"></nav><div id="error" hidden class="error"></div>
<div id="pager"><div><strong id="resultsLabel"></strong><p id="categoryNote" class="small-note muted"></p></div><div class="toolbar"><button id="previous">上一頁</button><span id="pageLabel" class="muted"></span><button id="next">下一頁</button></div></div>
<section id="cards" class="cards" aria-label="已保存內容列表"></section><p id="bottomCount" class="small-note muted"></p>
<details id="engineering"><summary>合成測試與工程診斷（不代表真實內容完整性）</summary>
<p class="small-note">以下只驗證虛構檔案的傳遞、隔離與程式行為。HTTP dry-run 沒有抓網站；預期無結果的查詢不能當成真實資料完整。</p>
<p id="diagnosticStatus"></p><div id="diagLinks"></div><h3>合成流程執行紀錄</h3><div id="trace"></div><h3>同版測試與內部資料</h3><pre id="diagnosticJson"></pre>
</details><footer>資料每次從本機 SQLite 讀回；頁面沒有寫入、審核或發布功能。</footer>
</main><script>
'use strict';
const $=id=>document.getElementById(id),initial=new URLSearchParams(location.search);
const state={page:Number(initial.get('page')||1),category:initial.get('category')||'all',query:initial.get('q')||''};
$('query').value=state.query;
const labels={all:'全部',item:'道具',achievement:'成就／徽章',mechanic:'機制',status:'狀態',location:'地點',creature:'生物',guide:'攻略',lore:'世界觀',update:'更新',other:'其他'};
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined&&text!==null)e.textContent=String(text);if(cls)e.className=cls;return e;}
function reset(id){const e=$(id);e.replaceChildren();return e;}
function list(parent,values){const ul=el('ul');values.forEach(v=>ul.append(el('li',v)));parent.append(ul);}
function external(label,url){const a=el('a',label);a.href=url;a.target='_blank';a.rel='noopener noreferrer';return a;}
function refs(values){return values?.length?' ['+values.join(', ')+']':'';}
function sourceBlock(source){const box=el('div',undefined,'source');box.append(el('strong','['+source.index+'] '+source.role+' · '+source.title));if(source.href){const p=el('p');p.append(external(source.href,source.href));box.append(p);}box.append(el('p',source.acquisition),el('p','定位：'+source.locator));if(source.source_updated_at)box.append(el('p','來源更新：'+source.source_updated_at+(source.updated_basis?.includes('timezone unknown')?'（時區未明）':'')));if(source.version)box.append(el('p','來源版本：'+source.version));if(source.quote){const d=el('details');d.append(el('summary','已保存的引用文字'),el('pre',source.quote));box.append(d);}if(source.context_href){const p=el('p');p.append(external(source.context_label,source.context_href));box.append(p);}if(source.license_url){const p=el('p');p.append(external(source.license_statement||'內容授權',source.license_url));box.append(p);}return box;}
function card(item){
 const box=el('article',undefined,'card');box.dataset.entry=item.entry_id;
 box.append(el('span',item.overview?'制度概覽':item.category_label,'tag'),el('h2',item.name_zh||item.name_en),el('div',item.name_en,'english'));
 const known=new Set([item.name_en,item.name_zh].map(v=>(v||'').toLocaleLowerCase())),aliases=[...new Set(item.aliases||[])].filter(a=>!known.has(a.toLocaleLowerCase()));if(aliases.length)box.append(el('p','別名：'+aliases.join('、'),'small-note muted'));
 if(item.condition_zh){box.append(el('h3','官方顯示條件'+refs(item.condition_refs)),el('p',item.condition_zh,'condition'));if(item.condition_en)box.append(el('p',item.condition_en,'small-note muted'));}
 if(item.summary_zh&&item.summary_zh!==item.condition_zh)box.append(el('p',item.summary_zh));
 if(item.statistics.length){box.append(el('h3','效果與數值'));const dl=el('dl',undefined,'stats');item.statistics.forEach(s=>{const pair=el('div',undefined,'stat');pair.append(el('dt',s.label),el('dd',s.display));dl.append(pair);});box.append(dl);}
 if(item.biomes.length){box.append(el('h3','出現區域'),el('p',item.biomes.map(v=>v==='Any'?'Any（任意生態區）':v).join('、')));}
 item.sections.forEach(section=>{box.append(el('h3',section.title+refs(section.source_refs)));list(box,section.lines);});
 item.guide_claims.forEach(c=>{const div=el('div',undefined,'guide');div.append(el('h3',c.title+refs(c.source_refs)),el('p',c.text));box.append(div);});
 if(item.sources.length){const first=item.sources[0],line=el('div',undefined,'source-line');line.append(el('span','已保存來源：'+(first.role?first.role+' · ':'')));line.append(first.href?external((first.site||first.title)+' ['+first.index+']',first.href):el('span',first.title+' ['+first.index+']'));line.append(el('span',' · '+first.acquisition));box.append(line);}
 if(item.gaps.length){const gap=el(item.condition_zh?'details':'div',undefined,item.condition_zh?'':'missing');if(item.condition_zh)gap.append(el('summary','尚缺的資料'));else gap.append(el('strong','尚缺資料'));list(gap,item.gaps);box.append(gap);}
 if(item.detail_page){const p=el('p',undefined,'small-note');p.append(el('span',item.detail_page.saved?'已保存詳細頁：':'對照原站：'),external('詳細頁連結',item.detail_page.href));box.append(p);}
 if(item.overview)box.append(el('p','這是制度概述；逐項條件請切換「成就／徽章」分類。','small-note muted'));
 const sources=el('details');sources.append(el('summary','精確來源與引用（'+item.sources.length+'）'));item.sources.forEach(s=>sources.append(sourceBlock(s)));box.append(sources);
 return box;
}
function diagnostics(data){$('diagnosticStatus').textContent='合成檔案流程檢查：'+data.checks.filter(c=>c.passed).length+'/'+data.checks.length+'。本輪網站原文入庫 '+data.result.real_documents_imported+'；真站取得至入庫尚未完成。';const links=reset('diagLinks');[['source-plan','合成來源計畫'],['input','虛構輸入'],['bundle-v1','合成資料包'],['result','工程結果 JSON'],['collector-tests','collector 測試 log'],['knowledge-tests','knowledge 測試 log']].forEach(([key,label])=>{const a=el('a',label);a.href='/artifact/'+key;a.target='_blank';a.rel='noopener';links.append(a);});$('diagnosticJson').textContent=JSON.stringify({commits:data.commits,current_commits:data.current_commits,working_trees:data.current_working_trees,tests:data.result.tests,formal_database_sha256:data.formal?.sha256,synthetic_queries_expected_no_data:data.result.queries},null,2);const trace=reset('trace');data.trace.forEach(t=>{const d=el('details');d.append(el('summary',t.label+' · exit '+t.exit_code+'（預期 '+t.expected_exit+'）'),el('pre',JSON.stringify(t,null,2)));trace.append(d);});}
async function load(){
 $('error').hidden=true;
 try{const params=new URLSearchParams({q:state.query,category:state.category,page:String(state.page)}),response=await fetch('/api/state?'+params),data=await response.json();if(!response.ok)throw Error(data.error||'無法讀取資料');const f=data.formal;
 if(!f){$('catalogStats').textContent='未指定正式資料庫。';reset('cards').append(el('p','沒有用合成資料代替內容。','empty'));return;}
 state.page=f.page;state.category=f.category;history.replaceState(null,'','?'+new URLSearchParams({q:state.query,category:state.category,page:String(state.page)}));
 $('catalogStats').textContent='已保存 '+f.counts.entries+' 條內容 · '+f.category_counts.item+' 項道具 · '+f.category_counts.achievement+' 項遊戲徽章';
 const categories=reset('categories');Object.entries(labels).forEach(([key,label])=>{const count=key==='all'?f.counts.entries:f.category_counts[key];if(!count&&key!=='all')return;const b=el('button',label+' '+count,key===f.category?'selected':'');b.setAttribute('aria-pressed',String(key===f.category));b.addEventListener('click',()=>{state.category=key;state.page=1;state.query='';$('query').value='';load();});categories.append(b);});
 $('resultsLabel').textContent=(state.query?'「'+state.query+'」 · ':'')+(labels[f.category]||'全部')+' · 第 '+f.range_start+'–'+f.range_end+' 項，共 '+f.total_matches+' 項';
 $('categoryNote').textContent=f.category==='achievement'?'逐項官方徽章條件；制度概述另列，不將它當成徽章清單。':'';
 $('pageLabel').textContent=f.page+' / '+f.pages;$('previous').disabled=f.page<=1;$('next').disabled=f.page>=f.pages;
 const cards=reset('cards');cards.classList.toggle('single',f.samples.length===1);f.samples.forEach(item=>cards.append(card(item)));if(!f.samples.length)cards.append(el('p','找不到符合的已保存內容。','empty'));
 $('bottomCount').textContent='本頁 '+f.samples.length+' 項；可用上方「上一頁／下一頁」繼續瀏覽。';diagnostics(data);
 }catch(error){$('error').hidden=false;$('error').textContent='讀取失敗：'+error.message;}
}
$('search').addEventListener('submit',event=>{event.preventDefault();state.query=$('query').value;state.category='all';state.page=1;load();});$('clear').addEventListener('click',()=>{state.query='';state.category='all';state.page=1;$('query').value='';load();});$('refresh').addEventListener('click',load);$('previous').addEventListener('click',()=>{state.page--;load();});$('next').addEventListener('click',()=>{state.page++;load();});load();
</script></body></html>
